services:
  carrete:
    build: .
    image: carrete:latest
    container_name: carrete
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    volumes:
      - ./data:/app/data      # SQLite DB
      - ./photos:/app/photos  # fotos originales + thumbs
    environment:
      DATABASE_URL: file:/app/data/carrete.db
      PHOTOS_DIR: /app/photos
      PORT: ${PORT:-3003}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:${PORT:-3003}}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    networks:
      - default
    volumes:
      - carrete-data:/app/data
      - carrete-photos:/app/photos

volumes:
  carrete-data:
  carrete-photos:
      

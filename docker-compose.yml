services:
  carrete:
    build: .
    image: carrete:latest
    container_name: carrete
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    volumes:
      - ./data:/app/data      # SQLite DB
      - ./photos:/app/photos  # fotos originales + thumbs
    environment:
      DATABASE_URL: file:/app/data/carrete.db
      PHOTOS_DIR: /app/photos
      PORT: ${PORT:-3003}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:${PORT:-3003}}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/api/health || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
